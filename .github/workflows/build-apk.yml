name: Build APK

on:
  push:
    branches: [ main, master, feat/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_platform:
        description: Target workflow slice to run
        required: true
        default: android-debug
        type: choice
        options:
          - android-debug
          - ios-appstore
      build_name:
        description: Version shown in App Store Connect
        required: false
        default: 1.0.0
      build_number:
        description: Unique iOS build number
        required: false
        default: 1
      publish_to_app_store_connect:
        description: Upload the generated IPA to App Store Connect
        required: false
        default: true
        type: boolean
      disable_activation_for_review:
        description: Build iOS review version without first-run activation gate
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target_platform == 'android-debug'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validar contexto do build
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          git rev-parse HEAD
          grep -n "coreLibraryDesugaringEnabled" android/app/build.gradle || true

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar local.properties
        run: |
          echo "flutter.sdk=$(which flutter | xargs dirname | xargs dirname)" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Instalar dependências
        run: flutter pub get

      - name: Build APK debug
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-invisivel-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  ios_appstore:
    name: Build signed iOS IPA
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_platform == 'ios-appstore'
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_CERTIFICATE_KEY: ${{ secrets.APP_STORE_CONNECT_CERTIFICATE_KEY }}
      APP_ACTIVATION_REQUIRED: ${{ secrets.APP_ACTIVATION_REQUIRED }}
      APP_ACTIVATION_TOTP_SECRET: ${{ secrets.APP_ACTIVATION_TOTP_SECRET }}

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Selecionar Xcode atual
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validar secrets obrigatorios
        run: |
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_KEY_IDENTIFIER"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          test -n "$APP_STORE_CONNECT_CERTIFICATE_KEY"

      - name: Instalar dependencias Dart
        run: flutter pub get

      - name: Instalar CocoaPods
        run: pod install --project-directory=ios

      - name: Instalar Codemagic CLI tools
        run: |
          python3 -m venv "$RUNNER_TEMP/codemagic-cli"
          source "$RUNNER_TEMP/codemagic-cli/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install codemagic-cli-tools
          echo "$RUNNER_TEMP/codemagic-cli/bin" >> "$GITHUB_PATH"

      - name: Preparar assinatura iOS
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$(xcode-project detect-bundle-id)" \
            --platform IOS \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --certificate-key @env:APP_STORE_CONNECT_CERTIFICATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --export-options-plist "$HOME/export_options.plist"

      - name: Build IPA assinado
        run: |
          BUILD_ARGS=(
            --release
            --build-name=${{ github.event.inputs.build_name || '1.0.0' }}
            --build-number=${{ github.event.inputs.build_number || '1' }}
            --export-options-plist=$HOME/export_options.plist
          )

          if [ "${{ github.event.inputs.disable_activation_for_review || 'false' }}" != 'true' ]; then
            if [ -n "$APP_ACTIVATION_REQUIRED" ]; then
              BUILD_ARGS+=(--dart-define=APP_ACTIVATION_REQUIRED=$APP_ACTIVATION_REQUIRED)
            fi

            if [ -n "$APP_ACTIVATION_TOTP_SECRET" ]; then
              BUILD_ARGS+=(--dart-define=APP_ACTIVATION_TOTP_SECRET=$APP_ACTIVATION_TOTP_SECRET)
            fi
          fi

          flutter build ipa "${BUILD_ARGS[@]}"

      - name: Upload IPA como artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-invisivel-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Enviar build para App Store Connect
        if: ${{ github.event.inputs.publish_to_app_store_connect != 'false' }}
        run: |
          IPA_PATH="$(find "$PWD/build/ios/ipa" -name '*.ipa' -print -quit)"
          LOG_FILE="$(mktemp)"

          set +e
          app-store-connect publish \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --path "$IPA_PATH" 2>&1 | tee "$LOG_FILE"
          PUBLISH_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$PUBLISH_EXIT" -ne 0 ]; then
            if grep -q "UPLOAD SUCCEEDED with no errors" "$LOG_FILE" && grep -q "No errors uploading archive" "$LOG_FILE"; then
              echo "Apple returned a transient post-upload error after a successful upload. Continuing."
            else
              exit "$PUBLISH_EXIT"
            fi
          fi

      - name: Restaurar keychain padrao
        if: always()
        run: |
          if command -v keychain >/dev/null 2>&1; then
            keychain use-login
          fi
